<div class="modal-header">
    <h4 class="modal-title">Opción de Busqueda</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-12" style="text-align:center;">
            <button type="button" class="btn btn-primary mr-2" (click)="activeModal.close('Locales por Cliente')">Buscar Cliente</button>
            <button type="button" class="btn btn-primary" (click)="activeModal.close('Locales de Ruta')">Clientes de Ruta</button>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="activeModal.dismiss()">Close</button>
</div>
