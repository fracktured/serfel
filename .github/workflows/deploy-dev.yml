name: Deploy dev

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: SST deploy dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Legacy Angular 14 build (Fase 3.5 rehost) ---
      # Angular 14 requires Node 16 (not 22). Build it FIRST with Node 16; the
      # StaticSite (infra/rehost/legacy-frontend.ts) points at the pre-built
      # dist/, which is gitignored, so CI must produce it. Use the production
      # configuration so bundles are content-hashed (index.html is served
      # no-cache; assets are immutable — hashed names avoid stale caches).
      - name: Setup Node 16 (for the Angular 14 build)
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build legacy Angular frontend
        working-directory: apps/legacy-frontend
        run: |
          # SST regenerates sst-env.d.ts here on deploy; it breaks the Angular
          # tsc build. Defensive delete (no-op on a fresh checkout).
          find . -name "sst-env.d.ts" -not -path "./node_modules/*" -delete || true
          # `npm install` (not `npm ci`): this vendored Angular 14 app's dep tree
          # produces a lockfile that npm 8's `npm ci` rejects as out-of-sync
          # (ajv/postcss-selector-parser transitive conflicts). npm install
          # reconciles it. Build output is deterministic (same content hash).
          npm install
          npx ng build --configuration production
          # Coproad variant (Fase 3.5): same Angular app, `coproad` configuration
          # (base-href /coproad/, environment.coproad.ts) -> dist/coproad-ang/coproad.
          # infra/rehost/coproad-frontend.ts's StaticSite points at dist/coproad-ang,
          # also gitignored, so CI must produce it or sst deploy fails with
          # "No site found at .../dist/coproad-ang".
          npx ng build --configuration coproad

      # --- Main toolchain: Node 22 + pnpm (SST) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Start MariaDB for tests
        run: docker compose -f packages/db/docker-compose.yml up -d --wait

      - name: Run workspace tests
        run: pnpm -r test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::146476548567:role/serfel-github-actions-role
          aws-region: us-east-1

      # --- npm shim (Fase 3.5 rehost) ---
      # SST's `nodejs.install` (the sales/orders Lambdas install sequelize+mysql2
      # into the bundle, since esbuild can't bundle Sequelize's dynamic dialect
      # require) invokes `npm install ... --platform=linux --arch=arm64 ...`.
      # Modern npm removed --platform/--arch (now --os/--cpu, which SST also
      # passes) and rejects the old flags (EUNKNOWNCONFIG) -> "failed to run
      # npm install". Shim `npm` to drop the two deprecated flags, then exec the
      # real npm. Harmless if a future npm accepts them.
      - name: Install npm shim for SST nodejs.install
        run: |
          REAL_NPM="$(command -v npm)"
          mkdir -p "$HOME/npmshim"
          cat > "$HOME/npmshim/npm" <<SHIM
          #!/usr/bin/env bash
          filtered=()
          for a in "\$@"; do case "\$a" in --platform=*|--arch=*|--platform|--arch) ;; *) filtered+=("\$a");; esac; done
          exec "$REAL_NPM" "\${filtered[@]}"
          SHIM
          chmod +x "$HOME/npmshim/npm"
          echo "$HOME/npmshim" >> "$GITHUB_PATH"

      - name: Deploy
        run: npx sst deploy --stage dev

      # --- Legacy PHP Fargate image (Fase 3.5 rehost) ---
      # The legacy PHP image build + push and the ECS force-deploy are NOT run
      # here. `sst deploy` above manages the ECS/ECR resources but never rebuilds
      # or pushes the image (the task def pins a static, mutable `:v1` tag). The
      # legacy PHP code changes rarely, and rebuilding it compiles PHP 5.6 +
      # mbstring from source (~10 min) on every push. When legacy-php/ DOES
      # change, build and deploy it manually — see legacy-php/README.md.

      - name: Run DB migrations (skips if DB is stopped)
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier serfel-dev-db --region us-east-1 \
            --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "missing")
          if [ "$STATUS" = "available" ]; then
            aws lambda invoke --region us-east-1 --function-name serfel-dev-migrate \
              --cli-read-timeout 120 response.json
            cat response.json
            grep -q '"ok":true' response.json
          else
            echo "::warning::serfel-dev-db is '$STATUS' — migrations skipped. Run 'pnpm db:migrate' after starting the DB."
          fi
