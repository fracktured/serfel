; Overrides para el rehost. El PHP 5.6 base trae max_execution_time = 30, que
; abortaba "Descargar seleccionadas" (concatenar ~100 facturas) antes de
; terminar. Se sube por encima del originReadTimeout de CloudFront (60 s, cdn.ts)
; y del idle timeout del ALB (120 s, alb.ts) para que el limite efectivo sea el
; de CloudFront, no PHP. memory_limit sube porque PDFMerger (FPDI/TCPDF) carga
; los ~200 PDFs en memoria; la task ahora tiene 2 GB (fargate.ts).
max_execution_time = 120
max_input_time = 120
memory_limit = 512M
default_socket_timeout = 60
